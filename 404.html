<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>页面不存在 · 许希楷</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%234D6BFE'/%3E%3Cpath fill='%23fff' d='M32 47c0-9 0-16 0-23-7-4-14-3-19 3 6 0 12 4 15 9 1 3 3 8 4 11 1-3 3-8 4-11 3-5 9-9 15-9-5-6-12-7-19-3z'/%3E%3C/svg%3E" />
<style>
  :root{--blue:#4D6BFE;--blue-deep:#2B41CC;--blue-soft:#EEF2FF;--blue-line:#D9E1FF;--ink:#0D1117;--muted:#6C7789}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:#fff;color:var(--ink);line-height:1.7;
    background-image:radial-gradient(circle,rgba(77,107,254,.12) 1px,transparent 1px);
    background-size:26px 26px;
  }
  .card{
    width:min(560px,100%);background:#fff;border:1px solid var(--blue-line);border-radius:24px;
    padding:clamp(32px,5vw,52px);box-shadow:0 24px 60px -34px rgba(43,65,204,.45);text-align:center;
  }
  .mark{width:52px;height:52px;margin:0 auto 22px;border-radius:16px;background:var(--blue-soft);display:grid;place-items:center}
  .mark svg{width:30px;height:30px}
  .code{font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.22em;color:var(--blue-deep);background:var(--blue-soft);border-radius:999px;padding:5px 14px;display:inline-block}
  h1{font-size:clamp(1.5rem,4vw,2rem);letter-spacing:-.03em;margin:18px 0 12px;line-height:1.25}
  p{margin:0;color:var(--muted);font-size:14.5px}
  a{
    display:inline-flex;align-items:center;gap:8px;margin-top:28px;text-decoration:none;
    background:var(--blue);color:#fff;font-size:14.5px;padding:12px 24px;border-radius:999px;
    transition:transform .25s cubic-bezier(.2,.8,.3,1),box-shadow .25s;
  }
  a:hover{transform:translateY(-2px);box-shadow:0 16px 30px -16px rgba(43,65,204,.75)}
</style>
</head>
<body>
  <main class="card">
    <div class="mark">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path fill="#4D6BFE" d="M32 46c0-9 0-15 0-22 -7-4-14-3-19 3 6 0 12 4 15 9 1 3 3 7 4 10 1-3 3-7 4-10 3-5 9-9 15-9 -5-6-12-7-19-3z"/>
      </svg>
    </div>
    <span class="code">ERROR 404</span>
    <h1>这个页面不存在</h1>
    <p>链接可能拼错了，或者这一页已经被移动。</p>
    <a href="/">回到报告首页 →</a>
  </main>
</body>
</html>
